name: Publicar Manual

on:
  workflow_dispatch:
    inputs:
      asin:
        description: 'Código único (ex: B0001)'
        required: true
      titulo:
        description: 'Título do produto'
        required: true
      preco:
        description: 'Preço atual (ex: 39,99 €)'
        required: true
      preco_anterior:
        description: 'Preço anterior (ex: 59,99 €) — deixa vazio se não houver'
        required: false
      desconto:
        description: 'Desconto em % (ex: 33)'
        required: true
      imagem:
        description: 'URL da imagem do produto'
        required: true
      link:
        description: 'Link de afiliado (amzn.to/...)'
        required: true
      caracteristica1:
        description: 'Característica 1'
        required: false
      caracteristica2:
        description: 'Característica 2'
        required: false
      caracteristica3:
        description: 'Característica 3'
        required: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar ficheiro .env
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}" >> .env
          echo "NOME_CANAL=${{ secrets.NOME_CANAL }}" >> .env

      - name: Publicar oferta
        env:
          ASIN: ${{ github.event.inputs.asin }}
          TITULO: ${{ github.event.inputs.titulo }}
          PRECO: ${{ github.event.inputs.preco }}
          PRECO_ANTERIOR: ${{ github.event.inputs.preco_anterior }}
          DESCONTO: ${{ github.event.inputs.desconto }}
          IMAGEM: ${{ github.event.inputs.imagem }}
          LINK: ${{ github.event.inputs.link }}
          CARACTERISTICA1: ${{ github.event.inputs.caracteristica1 }}
          CARACTERISTICA2: ${{ github.event.inputs.caracteristica2 }}
          CARACTERISTICA3: ${{ github.event.inputs.caracteristica3 }}
        run: python publicar_manual_cli.py
