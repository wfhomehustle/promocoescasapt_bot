name: Scraper de Produtos

on:
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Criar ficheiro .env
        run: |
          echo "AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}" >> .env

      - name: Correr scraper
        run: python scraper.py

      - name: Guardar CSV e links.txt actualizados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add produtos_novos.csv links.txt
          git commit -m "Scraping de produtos concluído" || echo "Sem alterações"
          git push
