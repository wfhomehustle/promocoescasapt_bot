name: Publicar via PA-API

on:
  schedule:
    - cron: '0,30 7-22 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar ficheiro .env
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "AMAZON_ACCESS_KEY=${{ secrets.AMAZON_ACCESS_KEY }}" >> .env
          echo "AMAZON_SECRET_KEY=${{ secrets.AMAZON_SECRET_KEY }}" >> .env
          echo "AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}" >> .env
          echo "NOME_CANAL=${{ secrets.NOME_CANAL }}" >> .env
          echo "AMAZON_PRIME_LINK=${{ secrets.AMAZON_PRIME_LINK }}" >> .env

      - name: Procurar e publicar ofertas via PA-API
        run: python publicar.py

      - name: Aguardar GitHub Pages indexar
        run: sleep 10

      - name: Guardar imagens, metadados e publicados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add publicados.txt imagens_sociais/ metadados_sociais/ historico_publicados.json
          ASIN=$(ls -t metadados_sociais/*.json 2>/dev/null | head -1 | xargs basename 2>/dev/null | sed 's/.json//' || echo "sem-produto")
          git commit -m "produto:${ASIN}" || echo "Sem alterações"
          git push
