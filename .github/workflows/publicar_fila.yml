name: Publicar Fila

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 19 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar ficheiro .env
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}" >> .env
          echo "AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}" >> .env
          echo "NOME_CANAL=${{ secrets.NOME_CANAL }}" >> .env

      - name: Publicar próximo da fila
        run: python publicar_da_fila.py

      - name: Guardar imagens para redes sociais
        uses: actions/upload-artifact@v4
        with:
          name: imagens-sociais
          path: imagens_sociais/
          retention-days: 7
        continue-on-error: true

      - name: Guardar fila atualizada
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add produtos_fila.json
          git commit -m "Remove produto publicado da fila" || echo "Sem alterações"
          git push
